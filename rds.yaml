# Learning template: not deployed. The master password is generated by RDS
# and stored in AWS Secrets Manager (ManageMasterUserPassword), not kept in code.
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudFormation template to create a basic MySQL RDS instance.

Resources:
  MyDB:
    Type: 'AWS::RDS::DBInstance'
    Properties:
      DBInstanceIdentifier: 'MyNewRDS'
      MasterUsername: 'admin'
      ManageMasterUserPassword: true
      DBInstanceClass: 'db.t3.micro'
      Engine: 'mysql'
      EngineVersion: '8.0.35'
      AllocatedStorage: '20'
      BackupRetentionPeriod: 7
